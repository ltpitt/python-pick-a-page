{% extends "base.html" %}

{% block title %}Pick-a-Page Story Tool{% endblock %}

{% block content %}
<div class="container">
    <div class="book">
        <!-- Language selector -->
        <div class="language-selector">
            <select id="languageSelector" aria-label="Select language">
                <!-- Populated dynamically by JavaScript -->
            </select>
        </div>
        
        <!-- Bookmark navigation -->
        <div class="bookmarks">
            <div class="bookmark active" data-page="library" data-i18n="web_tab_library">📚 Story Library</div>
            <div class="bookmark" data-page="editor" data-i18n="web_tab_editor">✏️ Story Editor</div>
            <div class="bookmark" id="playerBookmark" data-page="player" style="display: none;" data-i18n="web_tab_reader">📖 Story Reader</div>
        </div>
        
        <!-- Page: Story Library -->
        <div class="page active" id="page-library">
            <h1 class="page-title magic-title" data-i18n="web_title_library">My Story Collection</h1>
            <div id="message" class="message"></div>

            <div class="tutorial-cta">
                <button id="tutorialBtn" class="btn btn-tutorial" type="button">
                    <span aria-hidden="true">🎓</span> <span id="tutorialBtnLabel">Show me how</span>
                </button>
            </div>
            
            <div id="storyList">
                <div class="loading active">
                    <div class="spinner"></div>
                    <p data-i18n="web_loading_stories">Loading your stories...</p>
                </div>
            </div>
            
            <div class="story-actions">
                <button id="playBtn" class="btn btn-secondary" disabled>
                    <span>▶️</span> <span data-i18n="web_btn_play">Play Story</span>
                </button>
                <button id="editLibraryBtn" class="btn btn-secondary" disabled>
                    <span>✏️</span> <span data-i18n="web_btn_edit">Edit Story</span>
                </button>
                <button id="newStoryBtn" class="btn btn-primary">
                    <span>➕</span> <span data-i18n="web_btn_new">New Story</span>
                </button>
            </div>
        </div>
        
        <!-- Page: Story Editor -->
        <div class="page" id="page-editor">
            <h1 class="page-title magic-title" id="editorTitle" data-i18n="web_title_editor">Create Your Story</h1>
            <div id="editorMessage" class="message"></div>

            <div class="editor-toolbar" id="editorToolbar" role="toolbar" aria-label="Insert Markdown">
                <div class="toolbar-group" id="toolbarFormat" role="group" aria-label="Format"></div>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <div class="toolbar-group" id="toolbarInsert" role="group" aria-label="Insert"></div>
                <div class="toolbar-spacer"></div>
                <button id="editorTutorialBtn" class="toolbar-help-btn" type="button">
                    <span aria-hidden="true">🎓</span> <span id="editorTutorialBtnLabel">Show me how</span>
                </button>
            </div>

            <div id="editorBadges" class="editor-badges" hidden aria-live="polite">
                <span class="editor-badges-label" id="editorBadgesLabel">Badges earned</span>
                <div class="editor-badges-list" id="editorBadgesList"></div>
            </div>

            <div class="editor-area">
                <textarea id="storyEditor" data-i18n-placeholder="web_editor_placeholder" placeholder="Write your adventure here...

Example format:

---
title: My Adventure
author: Your Name
---

[[beginning]]

You wake up in a mysterious place...

[[Explore]]
[[Go back to sleep]]

---

[[Explore]]

You discover something amazing!"></textarea>
            </div>
            
            <div class="story-actions">
                <button id="validateBtn" class="btn btn-secondary">
                    <span>✓</span> <span data-i18n="web_btn_validate">Validate</span>
                </button>
                <button id="saveBtn" class="btn btn-secondary">
                    <span>💾</span> <span data-i18n="web_btn_save">Save</span>
                </button>
                <button id="compileBtn" class="btn btn-primary">
                    <span>🚀</span> <span data-i18n="web_btn_compile">Compile & Play</span>
                </button>
            </div>
        </div>
        
        <!-- Page: Story Player (hidden by default) -->
        <div class="page" id="page-player">
            <iframe id="storyPlayer" class="story-player"></iframe>
        </div>
    </div>
</div>

<!-- Tutorial overlay (hidden by default) -->
<div id="tutorialOverlay" class="tutorial-overlay" hidden>
    <div class="tutorial-modal" role="dialog" aria-modal="true" aria-labelledby="tutorialHeading">
        <button id="tutorialClose" class="tutorial-close" type="button" aria-label="Close">✕</button>
        <h2 id="tutorialHeading">How to make a story</h2>
        <div id="tutorialSteps" class="tutorial-steps"></div>
        <h3 id="tutorialCheatHeading" class="tutorial-subheading">Markdown help</h3>
        <div id="tutorialCheat" class="markdown-help-items"></div>
        <button id="tutorialDone" class="btn btn-primary tutorial-done" type="button">Got it!</button>
    </div>
</div>
{% endblock %}
